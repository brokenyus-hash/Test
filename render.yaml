# Render blueprint: https://render.com/docs/blueprint-spec
# One-tap deploy: https://render.com/deploy?repo=https://github.com/brokenyus-hash/Test
# Free plan = no persistent disk: chats reset when the instance restarts (fine for testing).
# For a permanent setup change plan to "starter" and add a disk (see README).
services:
  - type: web
    name: tavern-ai-roleplay
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: XAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: PROVIDER
        value: xai
